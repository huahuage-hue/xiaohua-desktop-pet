<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小嬅</title>
<style>
  /* 桌宠窗口：整页透明，只有角色像素可见 */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; -webkit-user-select: none; }
  [hidden] { display: none !important; }
  body { font: 13px/1.4 "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif; }
  .stage { position: fixed; inset: 0; }
  /* v0.2.0：窗口顶部 70px（占窗口高 610 的 11.5%）留给气泡，角色画布在下方 540 区域，大小与旧版一致 */
  .stage canvas { position: absolute; left: 0; right: 0; bottom: 0; top: 11.475%; width: 100%; height: 88.525%; display: block; }
  /* 漫画对白输入栏（v0.6.0）：只占她脚边一条，人始终看得见；回复走头顶 chat 气泡，完整记录在侧边聊天窗 */
  .cb { position: absolute; left: 12px; right: 12px; bottom: 6px; z-index: 9; display: none; flex-direction: column; gap: 4px; margin: 0; }
  .cb.on { display: flex; animation: cbIn .22s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes cbIn { from { opacity: 0; transform: translateY(8px) scale(.97); } }
  .cb-row { display: flex; align-items: center; gap: 2px; height: 34px; padding: 0 4px 0 12px; box-sizing: border-box;
    background: rgba(251,246,234,.97); border: 1.5px solid #8B6A4E; border-radius: 999px;
    box-shadow: 0 2px 0 rgba(139,106,78,.16), 0 6px 14px rgba(74,58,50,.2); }
  .cb-row:focus-within { box-shadow: 0 0 0 2px rgba(192,122,69,.25), 0 6px 14px rgba(74,58,50,.2); }
  .cb input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: #4A3A32;
    font: 12.5px/1.4 "YouYuan", "幼圆", "Microsoft YaHei UI", sans-serif; user-select: text; -webkit-user-select: text; }
  .cb input::placeholder { color: #A38E7A; }
  .cb .ico { flex: none; width: 26px; height: 26px; border: 0; border-radius: 50%; background: transparent; color: #8B6A4E;
    display: grid; place-items: center; padding: 0; cursor: pointer; font: 13px/1 "Microsoft YaHei UI", sans-serif; }
  .cb .ico:hover { background: #F1E6D6; }
  .cb .ico:focus-visible { outline: 2px solid #C07A45; outline-offset: 1px; }
  .cb .ico svg { width: 15px; height: 15px; display: block; }
  .cb .send { color: #fff; background: #8B6A4E; }
  .cb .send:hover { background: #7A5A40; }
  .cb-tip { align-self: center; display: flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 4px 3px 10px; border-radius: 999px;
    background: #FFF6F4; border: 1px solid #E3BDB7; color: #A2463E; font-size: 11px; box-shadow: 0 2px 6px rgba(74,58,50,.12); }
  .cb-tip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cb-tip button { flex: none; border: 1px solid #E3BDB7; background: #fff; color: #A2463E; border-radius: 999px; padding: 1px 8px; font-size: 11px; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .cb.on { animation: none; } }
  /* 悬停快捷按钮：只在鼠标靠近角色时出现，位置避开脸和聊天框 */
  .quick { position: absolute; right: 8px; bottom: 150px; z-index: 7; display: flex; flex-direction: column; gap: 6px;
    opacity: 0; transform: translateX(6px); pointer-events: none; transition: opacity .18s ease-out, transform .18s ease-out; }
  .quick.on { opacity: 1; transform: none; pointer-events: auto; }
  .quick button { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid #8B6A4E; background: rgba(251,246,234,.95);
    color: #8B6A4E; display: grid; place-items: center; padding: 0; cursor: pointer;
    box-shadow: 0 2px 0 rgba(139,106,78,.16), 0 4px 10px rgba(74,58,50,.15); }
  .quick button:hover { background: #F1E6D6; }
  .quick button:focus-visible { outline: 2px solid #C07A45; outline-offset: 2px; }
  .quick svg { width: 16px; height: 16px; display: block; }
  @media (prefers-reduced-motion: reduce) { .quick { transition: none; } }
  #gl { cursor: grab; touch-action: none; outline: none; }
  #fx { pointer-events: none; }
  .msg { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); margin: 0; padding: 3px 12px;
    background: rgba(40, 36, 30, .86); color: #fff; border-radius: 999px; font-size: 12px; white-space: nowrap;
    opacity: 0; transition: opacity .2s ease-out; pointer-events: none; }
  .msg.show { opacity: 1; }
  .loading { position: absolute; inset: auto 0 40% 0; text-align: center; color: #5a524a; font-size: 12px;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff; }

  /* 调试（pet.html?debug 或普通浏览器打开）：棋盘格背景检查透明；圆点 = 鼠标处判定（绿 = 可点，红 = 穿透） */
  body.debug { background: repeating-conic-gradient(#d9d9d9 0 25%, #f4f4f4 0 50%) 0 0 / 20px 20px; }
  .dbg { position: fixed; left: 6px; bottom: 6px; padding: 3px 8px; border-radius: 4px; background: rgba(0,0,0,.72);
    color: #fff; font: 11px/1.4 Consolas, monospace; pointer-events: none; display: none; }
  .dot { position: fixed; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.4); pointer-events: none; display: none; }
  body.debug .dbg, body.debug .dot { display: block; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="loading" id="loading">正在加载小嬅…</div>
  <canvas id="gl" role="img" aria-label="桌宠小嬅：点头、身体、云朵会有反应，按住可以拖动"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <div class="quick" id="quick" role="group" aria-label="快捷操作" aria-hidden="true" inert>
    <button type="button" data-q="chat" aria-label="和小嬅聊天" title="聊天">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h16v10H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>
    </button>
    <button type="button" data-q="sleep" aria-label="让她睡觉或叫醒她" title="睡觉 / 叫醒">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
    </button>
    <button type="button" data-q="panel" aria-label="打开控制面板" title="控制面板">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M6 18l1.4-1.4M16.6 7.4 18 6"/></svg>
    </button>
  </div>
  <form class="cb" id="cb" autocomplete="off" aria-label="和小嬅说话">
    <div class="cb-tip" id="cbTip" role="status" hidden><span id="cbTipText"></span><button type="button" id="cbRetry">重发</button></div>
    <div class="cb-row">
      <input id="cbIn" maxlength="300" placeholder="和小嬅说点什么…" aria-label="和小嬅说话" enterkeyhint="send" spellcheck="false">
      <button type="button" class="ico" id="cbStop" title="让她停下" aria-label="停止回复" hidden>■</button>
      <button type="submit" class="ico send" id="cbSend" title="发送（Enter）" aria-label="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
      <button type="button" class="ico" id="cbSide" title="展开聊天窗：看完整记录" aria-label="展开聊天窗">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h16v10H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>
      </button>
      <button type="button" class="ico" id="cbClose" title="收起（Esc）" aria-label="收起输入栏">×</button>
    </div>
  </form>
</div>
<div class="dot" id="dot"></div>
<div class="dbg" id="dbg"></div>
<script>
window.XH_PET = true;
/* v0.2.1：开机自启（带 --autostart）拉起时，不播开场招呼，免得一开机就出声 */
window.XH_GREET_GATE = (function () {
  var T = window.__TAURI__;
  if (!T || !T.core) return Promise.resolve(false);
  return Promise.race([
    T.core.invoke('launched_autostart').then(function (v) { return !!v; }, function () { return false; }),
    new Promise(function (r) { setTimeout(function () { r(false); }, 1500); })
  ]);
})();
</script>
<script src="assets/xiaohua_layers.js"></script>
<script src="assets/app-core.js"></script>
<script src="assets/app-render.js"></script>
<script src="assets/xiaohua_wardrobe.js"></script>
<script src="assets/app-dress.js"></script>
<script src="assets/app-sfx.js"></script>
<script src="assets/app-bubble.js"></script>
<script src="assets/app-assist.js"></script>
<script src="assets/app.js"></script>
<script src="memory.js"></script>
<script src="chat.js"></script>
<script src="scene.js"></script>
<script src="pet.js"></script>
</body>
</html>
