[package]
name = "xiaohua-pet"
version = "0.6.1"
description = "小嬅桌宠"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
# 自动更新：读 latest.json、校验 minisign 签名、跑 NSIS 安装包
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# AI 对话：同步 HTTP + rustls，不依赖系统 OpenSSL；在后台线程里流式读 SSE
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# 看屏幕：截图缩放 + JPEG 编码（只开 jpeg），发给视觉模型前转 base64
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Security", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Graphics_Dwm"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
